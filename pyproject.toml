[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "review-desk"
version = "0.1.0"
description = "A local desk for answering peer review: read the paper with reviewer comments in the margin, classify root causes, hand edits to a coding agent, draft the response letter."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]
test = ["pytest"]

[project.scripts]
review-desk = "review_desk.cli:main"

[tool.setuptools]
packages = ["review_desk"]

[tool.setuptools.package-data]
review_desk = ["static/*", "static/vendor/katex/*", "static/vendor/katex/fonts/*"]
